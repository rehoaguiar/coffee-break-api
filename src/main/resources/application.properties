spring.application.name=coffeebreakapi
# 8080 costuma estar ocupada e 8081 e a porta padrao do Expo
server.port=${PORT:8090}
# Origens do app web (Expo) que podem chamar a API pelo navegador
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.jwt.secret=${APP_JWT_SECRET:minha-chave-secreta-para-jwt-com-32-caracteres}
app.jwt.expiration-ms=3600000
spring.datasource.url=${DB_URL:jdbc:h2:mem:coffeebreakdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
